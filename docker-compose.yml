
# Deux services : MLflow et notre API
services:

  # Service 1 : serveur MLflow
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1

    command: >
      
        mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --artifacts-destination /mlflow/artifacts
        --allowed-hosts "mlflow:5000,localhost:*"

    ports:
      - "5000:5000"

    volumes:
      - mlflow-data:/mlflow

  # Service 2 : API FastAPI
  api:
    build: .

    ports:
      - "8002:8000"

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/churn-model@champion

    depends_on:
      - mlflow

    restart: on-failure

# Volume pour conserver les données MLflow
volumes:
  mlflow-data:
